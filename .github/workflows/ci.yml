name: Проверка

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Запустить проверки
        run: npm test

      - name: Проверить сборку
        run: npm run build

      - name: Проверить ZIP
        run: unzip -t dist/foundry-quest-log-ru.zip
