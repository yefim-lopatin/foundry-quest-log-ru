name: Проверка и выпуск

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить версию тега
        run: |
          VERSION=$(node -p "require('./module.json').version")
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Запустить проверки
        run: npm test

      - name: Собрать пакет
        run: npm run build

      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/module.json
          dist/foundry-quest-log-ru.zip
          --title "$GITHUB_REF_NAME"
          --generate-notes
